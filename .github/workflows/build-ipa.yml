
name: Build IPA from your own Spotify IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct link to decrypted Spotify IPA"
        required: true
        type: string

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Download current Taurus source
        run: |
          git clone --depth 1 --branch main \
            https://gitlab.com/taurustweak/taurus.git source
          test -f source/Makefile

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Theos
        uses: actions/checkout@v5
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install build tools
        run: |
          brew install make dpkg ldid
          python3 -m pip install --break-system-packages \
            git+https://github.com/asdfzxcvbn/pyzule-rw.git

      - name: Download Spotify IPA
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          mkdir -p source/ipa
          curl -fL --retry 3 "$IPA_URL" \
            -o source/ipa/spotify.ipa
          unzip -t source/ipa/spotify.ipa > /dev/null

      - name: Build Taurus IPA
        run: |
          gmake -C source release

      - name: Upload finished IPA
        uses: actions/upload-artifact@v5
        with:
          name: Taurus-IPA
          path: source/out/*.ipa
          if-no-files-found: error
